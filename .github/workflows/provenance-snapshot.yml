name: Provenance snapshot generation
on:
  push:
    branches: [fix/rust-research-provenance]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Generate actual research snapshot
        env:
          INSTA_UPDATE: always
        run: cargo test -p fsm-surface --test snapshots snapshot_research_brief --locked
      - name: Test complete surface
        run: cargo test -p fsm-surface --locked
      - uses: actions/upload-artifact@v4
        with:
          name: research-brief-snapshot
          path: crates/surface/tests/snapshots/snapshots__research_brief.snap
          if-no-files-found: error
